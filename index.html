    <script>
        // ============================================================
        //  VALIDATION & UI (unchanged)
        // ============================================================
        const VALID_KEY = "JISAN55667";
        let engineActive = false;
        let currentPrediction = null;
        let lastFetchedId = null;
        let timerInterval = null;

        function _0xAlpha() {
            const inputKey = document.getElementById('pw-in').value.trim();
            const msgBox = document.getElementById('srv-msg');
            if (!inputKey) {
                msgBox.innerText = "ENTER KEY!";
                return;
            }
            msgBox.innerText = "VERIFYING KEY...";
            if (inputKey === VALID_KEY) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                engineActive = true;
                fetchAndAnalyze();
                if (!timerInterval) startTimer();
            } else {
                msgBox.innerText = "INVALID KEY!";
                alert("INVALID KEY!");
            }
        }

        function getCurrentPeriod() {
            const now = Math.floor(Date.now() / 1000);
            return Math.floor(now / 30).toString();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const now = new Date();
                const sec = now.getSeconds();
                const remain = 30 - (sec % 30);
                const display = (remain === 30 ? 0 : remain).toString().padStart(2, '0');
                document.getElementById('displayPeriod').innerText = "TIME: " + display + "s";
                if (engineActive && (sec % 3 === 0)) {
                    fetchAndAnalyze();
                }
            }, 1000);
        }

        // ============================================================
        //  FULLY DETERMINISTIC PREDICTION ENGINE
        //  All outputs depend SOLELY on the 30-second Period ID.
        //  No session state, no weight mutation, no runtime drift.
        // ============================================================

        class PatternPredictor {
            constructor() {
                // ── STATIC WEIGHTS: never modified after construction ──
                this.weights = {
                    streak: 28,
                    alternating: 22,
                    pair: 16,
                    triple: 14,
                    gap: 8,
                    momentum: 7,
                    frequency: 5,
                    crossover: 12,
                    volatility: 6
                };
            }

            // ---------- seeded random helpers (deterministic) ----------
            _seedRand(seed) {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }

            _hashToSeed(str) {
                let h = 0;
                for (let i = 0; i < str.length; i++) {
                    h = ((h << 5) - h) + str.charCodeAt(i);
                    h |= 0;
                }
                return Math.abs(h);
            }

            // ---------- generate deterministic history for a given period ----------
            generateHistory(periodId, count = 16) {
                const seed = this._hashToSeed(periodId);
                const results = [];
                for (let i = 0; i < count; i++) {
                    const s = seed + i * 137 + Math.floor(i / 3) * 311;
                    let r = this._seedRand(s);
                    const bias = Math.sin(i * 1.7 + seed * 0.01) * 0.15 + 0.5;
                    r = (r + bias * 0.3) % 1.0;
                    const num = Math.floor(r * 10);
                    const issue = (BigInt(periodId) - BigInt(i)).toString();
                    results.push({ number: num, issueNumber: issue });
                }
                return results;
            }

            // ---------- pattern detectors (all deterministic) ----------

            detectStreak(history) {
                if (history.length < 3) return null;
                const labels = history.map(h => h.number >= 5 ? 'BIG' : 'SMALL');
                let maxStreak = 1,
                    curStreak = 1,
                    streakDir = labels[0];
                for (let i = 1; i < labels.length; i++) {
                    if (labels[i] === labels[i - 1]) {
                        curStreak++;
                        if (curStreak > maxStreak) { maxStreak = curStreak;
                            streakDir = labels[i]; }
                    } else { curStreak = 1; }
                }
                if (maxStreak >= 3) {
                    const pred = (streakDir === 'BIG') ? 'SMALL' : 'BIG';
                    const conf = Math.min(0.95, 0.55 + (maxStreak - 2) * 0.12);
                    return { prediction: pred, confidence: conf, pattern: 'streak', detail: maxStreak + 'x' };
                }
                return null;
            }

            detectAlternating(history) {
                if (history.length < 5) return null;
                const labels = history.map(h => h.number >= 5 ? 1 : 0);
                let altCount = 1;
                for (let i = 1; i < labels.length; i++) {
                    if (labels[i] !== labels[i - 1]) altCount++;
                    else break;
                }
                if (altCount >= 4) {
                    const last = labels[0];
                    const pred = (last === 1) ? 'SMALL' : 'BIG';
                    const conf = Math.min(0.90, 0.50 + altCount * 0.08);
                    return { prediction: pred, confidence: conf, pattern: 'alternating', detail: altCount + ' alt' };
                }
                return null;
            }

            detectPair(history) {
                if (history.length < 4) return null;
                const labels = history.map(h => h.number >= 5 ? 'B' : 'S');
                const pairs = [];
                for (let i = 0; i < labels.length - 1; i++) pairs.push(labels[i] + labels[i + 1]);
                const freq = {};
                pairs.forEach(p => { freq[p] = (freq[p] || 0) + 1; });
                let maxPair = '',
                    maxCount = 0;
                for (const [p, c] of Object.entries(freq)) {
                    if (c > maxCount) { maxCount = c;
                        maxPair = p; }
                }
                if (maxCount >= 2) {
                    const lastChar = maxPair[1];
                    const pred = (lastChar === 'B') ? 'SMALL' : 'BIG';
                    const conf = Math.min(0.88, 0.45 + maxCount * 0.12);
                    return { prediction: pred, confidence: conf, pattern: 'pair', detail: maxPair + ' x' + maxCount };
                }
                return null;
            }

            detectTriple(history) {
                if (history.length < 5) return null;
                const labels = history.map(h => h.number >= 5 ? 'B' : 'S');
                const triples = [];
                for (let i = 0; i < labels.length - 2; i++) triples.push(labels[i] + labels[i + 1] + labels[i + 2]);
                const freq = {};
                triples.forEach(t => { freq[t] = (freq[t] || 0) + 1; });
                let maxTriple = '',
                    maxCount = 0;
                for (const [t, c] of Object.entries(freq)) {
                    if (c > maxCount) { maxCount = c;
                        maxTriple = t; }
                }
                if (maxCount >= 2) {
                    const lastChar = maxTriple[2];
                    const pred = (lastChar === 'B') ? 'SMALL' : 'BIG';
                    const conf = Math.min(0.92, 0.50 + maxCount * 0.14);
                    return { prediction: pred, confidence: conf, pattern: 'triple', detail: maxTriple + ' x' + maxCount };
                }
                return null;
            }

            detectGap(history) {
                if (history.length < 6) return null;
                const labels = history.map(h => h.number >= 5 ? 'B' : 'S');
                let seq = labels.join('');
                let found = null;
                if (seq.includes('BBSS')) found = 'BBSS';
                else if (seq.includes('SSBB')) found = 'SSBB';
                if (found) {
                    const pred = (found === 'BBSS') ? 'BIG' : 'SMALL';
                    return { prediction: pred, confidence: 0.72, pattern: 'gap', detail: found };
                }
                return null;
            }

            detectMomentum(history) {
                if (history.length < 6) return null;
                const nums = history.map(h => h.number);
                const recent = nums.slice(0, 3);
                const older = nums.slice(3, 6);
                const avgRecent = recent.reduce((a, b) => a + b, 0) / recent.length;
                const avgOlder = older.reduce((a, b) => a + b, 0) / older.length;
                const diff = avgRecent - avgOlder;
                if (Math.abs(diff) > 1.2) {
                    const pred = (diff > 0) ? 'BIG' : 'SMALL';
                    const conf = Math.min(0.85, 0.50 + Math.abs(diff) * 0.10);
                    return { prediction: pred, confidence: conf, pattern: 'momentum', detail: diff.toFixed(1) };
                }
                return null;
            }

            detectFrequency(history) {
                if (history.length < 8) return null;
                const nums = history.map(h => h.number);
                const bigCount = nums.filter(n => n >= 5).length;
                const smallCount = nums.length - bigCount;
                const ratio = bigCount / nums.length;
                if (ratio > 0.65) {
                    return { prediction: 'SMALL', confidence: 0.55 + (ratio - 0.65) * 1.2, pattern: 'frequency',
                        detail: 'BIG ' + (ratio * 100).toFixed(0) + '%' };
                } else if (ratio < 0.35) {
                    return { prediction: 'BIG', confidence: 0.55 + (0.35 - ratio) * 1.2, pattern: 'frequency',
                        detail: 'SMALL ' + ((1 - ratio) * 100).toFixed(0) + '%' };
                }
                return null;
            }

            detectCrossover(history) {
                if (history.length < 8) return null;
                const nums = history.map(h => h.number);
                const last3 = nums.slice(0, 3);
                const last6 = nums.slice(0, 6);
                const avg3 = last3.reduce((a, b) => a + b, 0) / last3.length;
                const avg6 = last6.reduce((a, b) => a + b, 0) / last6.length;
                const diff = avg3 - avg6;
                if (Math.abs(diff) > 0.8) {
                    const pred = (diff > 0) ? 'BIG' : 'SMALL';
                    const conf = Math.min(0.80, 0.45 + Math.abs(diff) * 0.12);
                    return { prediction: pred, confidence: conf, pattern: 'crossover', detail: diff.toFixed(1) };
                }
                return null;
            }

            detectVolatility(history) {
                if (history.length < 5) return null;
                const nums = history.map(h => h.number);
                const recent = nums.slice(0, 4);
                const mean = recent.reduce((a, b) => a + b, 0) / recent.length;
                const variance = recent.reduce((a, b) => a + (b - mean) ** 2, 0) / recent.length;
                const std = Math.sqrt(variance);
                if (std > 2.5) {
                    const last = nums[0];
                    const pred = (last >= 5) ? 'SMALL' : 'BIG';
                    const conf = 0.60 + std * 0.04;
                    return { prediction: pred, confidence: Math.min(0.85, conf), pattern: 'volatility',
                    detail: std.toFixed(1) };
                }
                return null;
            }

            _fallbackTrend(history) {
                const nums = history.map(h => h.number);
                const big = nums.filter(n => n >= 5).length;
                const small = nums.length - big;
                const pred = (big >= small) ? 'SMALL' : 'BIG';
                const conf = 0.45 + Math.abs(big - small) / (nums.length * 2);
                return {
                    prediction: pred,
                    confidence: Math.min(0.70, conf),
                    pattern: 'fallback',
                    weight: 5,
                    detail: 'trend'
                };
            }

            analyze(periodId) {
                const history = this.generateHistory(periodId, 16);

                const detectors = [
                    this.detectStreak.bind(this),
                    this.detectAlternating.bind(this),
                    this.detectPair.bind(this),
                    this.detectTriple.bind(this),
                    this.detectGap.bind(this),
                    this.detectMomentum.bind(this),
                    this.detectFrequency.bind(this),
                    this.detectCrossover.bind(this),
                    this.detectVolatility.bind(this)
                ];

                const results = [];
                for (let i = 0; i < detectors.length; i++) {
                    const r = detectors[i](history);
                    if (r) {
                        r.confidence = Math.max(0.30, Math.min(0.98, r.confidence));
                        const w = this.weights[r.pattern] || 10;
                        r.weight = w;
                        r.detectorName = r.pattern;
                        results.push(r);
                    }
                }

                if (results.length === 0) {
                    const fb = this._fallbackTrend(history);
                    fb.detectorName = 'fallback';
                    results.push(fb);
                }

                let bigScore = 0,
                    smallScore = 0,
                    totalWeight = 0;
                let confSum = 0,
                    confCount = 0;
                let bestPattern = 'WEIGHTED';

                for (const r of results) {
                    const w = r.weight || 10;
                    totalWeight += w;
                    if (r.prediction === 'BIG') bigScore += w * r.confidence;
                    else smallScore += w * r.confidence;
                    confSum += r.confidence;
                    confCount++;
                    if (r.pattern && r.pattern !== 'fallback') bestPattern = r.pattern.toUpperCase();
                }

                const pred = (bigScore >= smallScore) ? 'BIG' : 'SMALL';
                const avgConf = confCount > 0 ? (confSum / confCount) : 0.50;
                const diff = Math.abs(bigScore - smallScore) / (totalWeight || 1);
                const boost = Math.min(0.20, diff * 0.6);
                let finalConf = Math.min(0.98, avgConf + boost);

                const eligible = (pred === 'BIG') ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
                const seed = this._hashToSeed(periodId + 'num');
                const pick = Math.abs(Math.sin(seed * 9999 + pred.charCodeAt(0)));
                const luckyNum = eligible[Math.floor(pick * eligible.length)];

                let trendLabel = bestPattern;
                if (pred === 'BIG') trendLabel += ' ▲';
                else trendLabel += ' ▼';

                return {
                    bs: pred,
                    num: luckyNum,
                    trend: trendLabel,
                    confidence: finalConf,
                    color: (pred === 'BIG') ? '#ffbe00' : '#00f5a0',
                    patternCount: results.length
                };
            }
        }

        // ============================================================
        //  GLOBAL PREDICTOR INSTANCE & FETCH
        // ============================================================
        const predictor = new PatternPredictor();

        function fetchAndAnalyze() {
            if (!engineActive) return;
            const currentPeriod = getCurrentPeriod();
            const nextId = (BigInt(currentPeriod) + 1n).toString();

            if (lastFetchedId === nextId && currentPrediction) return;

            const result = predictor.analyze(nextId);

            // ----- INVERT PREDICTION (BIG ↔ SMALL) -----
            const originalBs = result.bs;
            const invertedBs = (originalBs === 'BIG') ? 'SMALL' : 'BIG';
            const invertedColor = (invertedBs === 'BIG') ? '#ffbe00' : '#00f5a0';

            // Extract pattern name from trend (remove arrow)
            const patternName = result.trend.replace(/[▲▼]/g, '').trim();
            const arrow = (invertedBs === 'BIG') ? '▲' : '▼';
            const invertedTrend = patternName + ' ' + arrow;

            // Build inverted prediction object
            currentPrediction = {
                id: nextId,
                bs: invertedBs,
                num: result.num,
                trend: invertedTrend,
                confidence: result.confidence,
                color: invertedColor,
                patternCount: result.patternCount
            };
            lastFetchedId = nextId;

            // Update UI
            const box = document.getElementById('predictionBox');
            box.innerText = currentPrediction.bs;
            box.style.color = currentPrediction.color;

            document.getElementById('luckyNumBox').innerText = 'NUM: ' + currentPrediction.num;

            const tag = document.getElementById('trendLabelBox');
            tag.innerText = currentPrediction.trend;
            tag.style.color = currentPrediction.color;

            const confPct = Math.round(currentPrediction.confidence * 100);
            document.getElementById('accuracyLabel').innerText = 'ACCURACY: ' + confPct + '%';

            const bar = document.getElementById('confBar');
            bar.style.width = confPct + '%';

            document.getElementById('confLabel').innerText = 'CONFIDENCE ' + confPct + '%';
        }

        // ============================================================
        //  DRAG LOGIC (unchanged)
        // ============================================================
        const parentWidget = document.getElementById('rgb-parent');
        let dragActive = false,
            dragOffX = 0,
            dragOffY = 0;

        function onDragStart(e) {
            const target = e.target;
            if (target.tagName === 'INPUT' || target.tagName === 'BUTTON') return;
            dragActive = true;
            const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const rect = parentWidget.getBoundingClientRect();
            dragOffX = cx - rect.left;
            dragOffY = cy - rect.top;
        }

        function onDragMove(e) {
            if (!dragActive) return;
            e.preventDefault();
            const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            parentWidget.style.left = (cx - dragOffX) + 'px';
            parentWidget.style.top = (cy - dragOffY) + 'px';
        }

        function onDragEnd() { dragActive = false; }

        parentWidget.addEventListener('mousedown', onDragStart);
        parentWidget.addEventListener('touchstart', onDragStart, { passive: false });

        const fabIcon = document.getElementById('fab-icon');
        let fabDrag = false,
            fabMoved = false,
            fabOffX = 0,
            fabOffY = 0;

        function onFabStart(e) {
            fabDrag = true;
            fabMoved = false;
            const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const rect = fabIcon.getBoundingClientRect();
            fabOffX = cx - rect.left;
            fabOffY = cy - rect.top;
        }

        function onFabMove(e) {
            if (!fabDrag) return;
            e.preventDefault();
            fabMoved = true;
            const cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            fabIcon.style.left = (cx - fabOffX) + 'px';
            fabIcon.style.top = (cy - fabOffY) + 'px';
        }

        function onFabEnd(e) {
            if (fabDrag) {
                fabDrag = false;
                if (!fabMoved) showWidget();
            }
        }

        fabIcon.addEventListener('mousedown', onFabStart);
        fabIcon.addEventListener('touchstart', onFabStart, { passive: false });

        window.addEventListener('mousemove', (e) => { onDragMove(e);
            onFabMove(e); });
        window.addEventListener('touchmove', (e) => { onDragMove(e);
            onFabMove(e); }, { passive: false });
        window.addEventListener('mouseup', () => { onDragEnd();
            onFabEnd(); });
        window.addEventListener('touchend', () => { onDragEnd();
            onFabEnd(); });

        function hideWidget() {
            const rect = parentWidget.getBoundingClientRect();
            fabIcon.style.left = (rect.left + rect.width / 2 - 27) + 'px';
            fabIcon.style.top = (rect.top + rect.height / 2 - 27) + 'px';
            parentWidget.style.display = 'none';
            fabIcon.style.display = 'block';
        }

        function showWidget() {
            const rect = fabIcon.getBoundingClientRect();
            parentWidget.style.left = (rect.left - 80) + 'px';
            parentWidget.style.top = (rect.top - 80) + 'px';
            parentWidget.style.display = 'flex';
            fabIcon.style.display = 'none';
        }

        // ============================================================
        //  INIT
        // ============================================================
        startTimer();
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
